<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ty.title">Thank you — Funes</title>
    <meta name="description" data-i18n-attr="content:ty.description" content="Your message reached us. We'll be in touch shortly.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            padding-left: 16px;
            border-left: 1px solid var(--line);
        }
        .lang-switch button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.15rem;
            line-height: 1;
            padding: 4px;
            border-radius: 5px;
            opacity: 0.5;
            transition: opacity 0.2s ease, background 0.2s ease;
        }
        .lang-switch button:hover {
            opacity: 0.85;
            background: rgba(255,255,255,0.08);
        }
        .lang-switch button.active {
            opacity: 1;
            background: rgba(255,255,255,0.12);
        }
        @media (max-width: 720px) {
            .lang-switch {
                margin-left: 0;
                padding-left: 0;
                border-left: none;
            }
        }
    </style>
</head>
<body class="funes-page">

    <header class="topbar">
        <div class="container">
            <a class="topbar-brand" href="/">
                <img src="img/logo.png" alt="Auto²ML" class="topbar-logo">
                <span class="topbar-product">Funes</span>
            </a>
            <nav class="topnav">
                <a href="/" class="btn-small" data-i18n="ty.back">Back to Funes</a>
                <span class="lang-switch" role="group" aria-label="Language / Idioma / 语言">
                    <button type="button" data-lang="en" title="English" aria-label="English">🇺🇸</button>
                    <button type="button" data-lang="es" title="Español (Argentina)" aria-label="Español (Argentina)">🇦🇷</button>
                    <button type="button" data-lang="zh" title="中文" aria-label="中文">🇨🇳</button>
                </span>
            </nav>
        </div>
    </header>

    <main>
        <section class="funes-hero">
            <div class="container">
                <h1 data-i18n="ty.h1">Thank you — your message is with us</h1>
                <p class="hero-sub" data-i18n="ty.sub">We read every one of these ourselves. Expect a reply within one working day, from a person, proposing a time for a half-hour look at Funes.</p>
                <div class="hero-actions">
                    <a href="/" class="btn-secondary" data-i18n="ty.back">Back to Funes</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="funes-footer">
        <div class="container">
            <span data-i18n="ty.made">Funes is made by Auto²ML.</span>
            <span data-i18n="ty.rights">&copy; 2026 Auto²ML. All rights reserved.</span>
        </div>
    </footer>

    <script src="js/i18n.js"></script>
</body>
</html>
